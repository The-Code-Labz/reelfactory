[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelfactory"
version = "0.1.0"
description = "Batch video generator daemon: TTS + images + ffmpeg subtitle burn"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
edge = ["edge-tts>=6.1.9"]

[project.scripts]
reelfactory = "reelfactory.cli:main"

[tool.setuptools.packages.find]
include = ["reelfactory*"]
